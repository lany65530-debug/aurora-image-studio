<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 率检测 · 极光工作室</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src https:"
    />
    <link rel="stylesheet" href="./src/styles/base/tokens.css" />
    <link rel="stylesheet" href="./src/styles/base/scrollbars.css" />
    <link rel="stylesheet" href="./src/styles/base/shell.css" />
    <link rel="stylesheet" href="./src/styles/workspace/detector.css" />
  </head>
  <body class="detector-body">
    <!-- 自定义标题栏（独立窗口，复用主窗口样式） -->
    <header class="titlebar">
      <div class="titlebar-drag">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7V5.5A1.5 1.5 0 0 1 5.5 4H7M17 4h1.5A1.5 1.5 0 0 1 20 5.5V7M20 17v1.5a1.5 1.5 0 0 1-1.5 1.5H17M7 20H5.5A1.5 1.5 0 0 1 4 18.5V17" />
              <path d="M4 12h16" />
            </svg>
          </span>
          <span class="brand-name">AI 率检测<span class="brand-thin" id="dtTitleHint">文本 AI 痕迹扫描</span></span>
        </div>
      </div>
      <div class="win-controls">
        <button class="win-btn" id="btnMin" title="最小化">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="5.4" width="8" height="1.2" rx="0.6" fill="currentColor" /></svg>
        </button>
        <button class="win-btn" id="btnMax" title="最大化">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.2" fill="none" /></svg>
        </button>
        <button class="win-btn win-btn-close" id="btnClose" title="关闭">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>
        </button>
      </div>
    </header>

    <main class="dt-shell" id="dtApp"></main>

    <div class="dt-toasts" id="dtToasts"></div>
    <div class="dt-mark-tip" id="dtMarkTip"></div>
    <div class="dt-modal" id="dtModal" role="dialog" aria-modal="true" aria-labelledby="dtModalTitle"></div>

    <script type="module" src="./src/detector/main.ts"></script>
  </body>
</html>
