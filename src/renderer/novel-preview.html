<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小说工作区 · 界面预览</title>
<link rel="stylesheet" href="./src/styles/workspace/novel.css">
<link rel="stylesheet" href="./src/styles/base/scrollbars.css">
<link rel="stylesheet" href="./src/styles/component/dialog.css">
<style>:root{--surface:#fff;--line:#e1e6ed}#confirmModal .modal-card{padding:24px;border-radius:8px}#confirmModal button{padding:8px 16px;border:1px solid #d9dfe6;border-radius:5px;background:#fff;cursor:pointer}#confirmOkBtn{color:#bd3446}#toastWrap{position:fixed;bottom:16px;right:16px;z-index:320;background:white}</style>
<style>html,body{height:100%;margin:0;font-family:"Microsoft YaHei",sans-serif;--font-body:"Microsoft YaHei",sans-serif}*{box-sizing:border-box}button,input,select{font-family:inherit}#novelRoot{height:100vh}</style></head>
<body><div id="novelRoot"></div><div id="toastWrap"></div><div id="confirmModal" class="modal-overlay" role="alertdialog" aria-modal="true"><div class="modal-card narrow"><h3 id="confirmTitle"></h3><p id="confirmMsg"></p><div><button id="confirmCancelBtn">取消</button><button id="confirmOkBtn">删除</button></div></div></div>
<script type="module">
const bridge = { save: async () => ({ok:true}), delete: async () => ({ok:true}) }
window.aurora = { novel: bridge, app:{}, window:{}, settings:{}, image:{}, chat:{}, library:{}, provider:{}, detector:{ open: async () => ({ ok: true }) } }
const { bindNovelWorkspace } = await import('./src/workspaces/novel.ts')
const { makeNovelWorkspace, store } = await import('./src/state/store.ts')
const ws = makeNovelWorkspace()
const paragraph = '清晨的第一班渡轮驶过河面，林夏站在码头上，看着远处的城市慢慢醒来。风里有雨后的清凉，也有一种久违的熟悉。她打开那封折了三次的信，纸页边缘已经泛白，最后一行字却依旧清楚：等你回来，我们再一起去看海。'
ws.novels = [{ id:'preview-novel', title:'风起时，去见你', author:'林间', cover:'#365d70', summary:'一封迟来的信，让两个阔别多年的朋友重新踏上归途。', premise:'', style:'', outline:{characters:[],locations:[],foreshadowing:[],chapterSummaries:[]}, currentChapter:0,currentPage:0,scrollPercent:0,createdAt:Date.now(),updatedAt:Date.now(),chapters:Array.from({length:8},(_,i)=>({id:'chapter-'+i,title:['渡口的来信','旧日车站','雨停之后','没有寄出的明信片','沿海公路','重逢','风的方向','下一次日出'][i],content:Array.from({length:18},()=>paragraph).join('\n\n'),updatedAt:Date.now()})) }]
store.workspaces = [ws]
store.activeId = ws.id
window.previewWorkspace = ws
bindNovelWorkspace(ws)
if (new URLSearchParams(location.search).get('view') !== 'library') document.querySelector('.novel-card').click()
</script></body></html>
